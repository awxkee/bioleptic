name: Publish to npm

on:
  push:
    tags:
      - '[0-9]*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build (bundler target)
        run: wasm-pack build --release --target bundler --out-dir pkg/bundler bioleptic-js

      - name: Build (web target)
        run: wasm-pack build --release --target web --out-dir pkg/web bioleptic-js

      - name: Build (nodejs target)
        run: wasm-pack build --release --target nodejs --out-dir pkg/nodejs bioleptic-js

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v6
        with:
          name: wasm-pkg
          path: bioleptic-js/pkg/
          retention-days: 1

  publish:
    name: Publish to npm
    needs: [ build ]
    runs-on: ubuntu-latest
    environment: Cargo
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Download pkg artifact
        uses: actions/download-artifact@v6
        with:
          name: wasm-pkg
          path: bioleptic-js/pkg/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: bioleptic-js
        run: npm install && npm ci

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' bioleptic-js/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version $VERSION"

      - name: Verify package versions match Cargo.toml
        run: |
          CARGO_VERSION="${{ steps.version.outputs.version }}"
          for target in bundler web nodejs; do
            PKG_VERSION=$(node -p "require('./bioleptic-js/pkg/$target/package.json').version")
            if [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
              echo "Version mismatch in $target: Cargo=$CARGO_VERSION pkg=$PKG_VERSION"
              exit 1
            fi
          done

      - name: Assemble dist/
        working-directory: bioleptic-js
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p dist/bundler dist/web dist/nodejs

          # Copy build outputs, excluding per-build package.json and .gitignore
          rsync -a --exclude='package.json' --exclude='.gitignore' \
            bioleptic-js/pkg/bundler/ dist/bundler/
          rsync -a --exclude='package.json' --exclude='.gitignore' \
            bioleptic-js/pkg/web/ dist/web/
          rsync -a --exclude='package.json' --exclude='.gitignore' \
            bioleptic-js/pkg/nodejs/ dist/nodejs/

          # wasm-pack nodejs target emits CJS files with .js extensions.
          # Under "type":"module" Node refuses to load .js files with require(),
          # so rename both the main file and the background glue to .cjs and
          # fix the internal require() reference between them.
          mv dist/nodejs/bioleptic_js.js    dist/nodejs/bioleptic_js.cjs
          sed -i "s|require('./bioleptic_js_bg.js')|require('./bioleptic_js_bg.cjs')|g" \
            dist/nodejs/bioleptic_js.cjs

          cp bioleptic-js/README.md dist/README.md

          # Stamp version from Cargo.toml into the repo's package.json
          # and write it to dist/ — no need to regenerate it every run.
          sed "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" \
            bioleptic-js/package.json > dist/package.json

          # Strip devDependencies — they don't belong in the published package
          jq 'del(.devDependencies)' dist/package.json \
            > dist/package.tmp && mv dist/package.tmp dist/package.json

      - name: Publish dist/
        working-directory: bioleptic-js/dist
        run: npm install && npm ci && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}